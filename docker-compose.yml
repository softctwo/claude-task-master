version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resoft-postgres
    environment:
      POSTGRES_USER: resoft
      POSTGRES_PASSWORD: resoft_dev
      POSTGRES_DB: resoft_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resoft -d resoft_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resoft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: resoft-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://resoft:resoft_dev@postgres:5432/resoft_studio
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=resoft-dev-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/api:/app
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: resoft-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev

  celery:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: resoft-celery
    environment:
      - DATABASE_URL=postgresql+psycopg2://resoft:resoft_dev@postgres:5432/resoft_studio
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=resoft-dev-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/api:/app
      - uploads:/app/uploads
    command: celery -A app.celery_app worker --loglevel=info

volumes:
  postgres_data:
  redis_data:
  uploads:
